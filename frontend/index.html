<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>PDF Viewer in JavaScript</title>
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/css/all.min.css"
      integrity="sha512-Kc323vGBEqzTmouAECnVceyQqyqdsSiqLQISBL29aUW4U/M7pSPA/gEUZQqv1cwx4OnYxTxve5UMg5GT6L4JJg=="
      crossorigin="anonymous"
      referrerpolicy="no-referrer"
    />
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <header>
      <ul class="navigation">
        <li class="navigation__item doc-info">
          <select id="doc_selector" class="doc-selector">
            <option value="tiny-1p.pdf">Tiny (1 page, 2KB)</option>
            <option value="small-2p.pdf">Small (2 pages, 88KB)</option>
            <option value="large-361p-12mb.pdf" selected>Large (361 pages, 12MB)</option>
          </select>
          <span id="doc_filename">Loading...</span>
          <span id="doc_size"></span>
        </li>

        <li class="navigation__item">
          <!-- Navigate to the Previous and Next pages -->
          <a href="#" class="previous round" id="prev_page"
            ><i class="fas fa-arrow-left"></i
          ></a>

          <!-- Navigate to a specific page -->
          <input type="number" value="1" id="current_page" />

          <a href="#" class="next round" id="next_page"
            ><i class="fas fa-arrow-right"></i
          ></a>

          <!-- Page Info -->
          Page <span id="page_num"></span> of
          <span id="page_count"></span>
        </li>

        <!-- Zoom In and Out -->
        <li class="navigation__item">
          <button class="zoom" id="zoom_in">
            <i class="fas fa-search-plus"></i>
          </button>

          <button class="zoom" id="zoom_out">
            <i class="fas fa-search-minus"></i>
          </button>
        </li>
      </ul>
    </header>

    <!-- canvas to place the PDF -->
    <canvas id="canvas" class="canvas__container"></canvas>

    <script type="module" src="index.js"></script>
  </body>
</html>
